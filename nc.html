<!DOCTYPE html>
<html lang="id">
<head>

<title>OMNI SYNC - Wadah Konvergensi Intelektual</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #05070f, #0a1930, #051228, #05070f);
    background-size: 400% 400%;
    animation: gradientGerak 18s ease infinite;
    color: #e2e8f0;
    font-family: 'Nunito', sans-serif;
    margin: 0 auto; padding: 16px 16px 60px;
    max-width: 680px;
    position: relative; overflow-x: hidden; min-height: 100vh;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background-image: 
      linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
    background-size: 30px 30px; z-index: -2; pointer-events: none;
  }
  
  @keyframes gradientGerak { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  @keyframes muncul { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulseGlow { 0%,100%{box-shadow:0 0 10px rgba(56,189,248,.3)} 50%{box-shadow:0 0 20px rgba(56,189,248,.6)} }

  h1, h2, h3 { 
    color: #38bdf8; font-weight: 800; 
    text-shadow: 0 2px 8px rgba(56,189,248,.3); 
    font-family: 'Orbitron','Nunito',sans-serif; 
    letter-spacing: .5px; margin-bottom: 10px;
  }
  h1 { font-size: 26px; text-transform: uppercase; } 
  h2 { font-size: 20px; }
  .animasi-halaman { animation: muncul .5s ease-out forwards; }

  /* ===== BUTTONS ===== */
  .btn {
    display: block; width: 100%; margin: 10px 0; padding: 16px;
    background: rgba(30,41,59,.75); backdrop-filter: blur(10px);
    color: #f8fafc; border: 1px solid rgba(56,189,248,.3); border-radius: 12px;
    font-size: 15px; font-weight: 700; text-align: left; cursor: pointer;
    transition: all .25s ease; font-family: 'Nunito',sans-serif;
    box-shadow: 0 4px 6px rgba(0,0,0,.2);
  }
  .btn:hover:not(:disabled) { 
    background: rgba(56,189,248,.15); 
    border-color: #38bdf8; 
    transform: translateY(-2px); 
    box-shadow: 0 6px 12px rgba(0,0,0,.3);
  }
  .btn:disabled { cursor: not-allowed; opacity: 0.6; }
  
  .btn.ok { border-color: #22c55e; background: rgba(22,163,74,.2); text-align: center; }
  .btn.ok:hover:not(:disabled) { background: rgba(22,163,74,.8); color:#fff; }
  
  .btn.biru { 
    background: #0284c7; color: #fff; text-align: center; 
    border-color: #38bdf8; animation: pulseGlow 3s infinite; 
  }
  .btn.biru:hover:not(:disabled) { background: #0369a1; }
  
  .btn.merah { border-color: #ef4444; background: rgba(153,27,27,.2); text-align: center; }
  .btn.merah:hover:not(:disabled) { background: rgba(239,68,68,.9); color:#fff; }

  /* Class Khusus Jawaban Kuis */
  .btn.jawaban { font-weight: 600; }
  .btn.benar { background: rgba(22,101,52,.9) !important; color:#fff !important; border-color:#22c55e !important; box-shadow: 0 0 15px rgba(34,197,94,0.4) !important; }
  .btn.salah { background: rgba(153,27,27,.9) !important; color:#fff !important; border-color:#ef4444 !important; }

  /* ===== KOTAK KONTEN ===== */
  .kotak {
    background: rgba(15,23,42,.6); backdrop-filter: blur(12px);
    border: 1px solid rgba(56,189,248,.15); border-radius: 16px;
    padding: 20px; margin: 16px 0; line-height: 1.7; font-size: 15px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .kotak.benar-bg { background: rgba(22,101,52,.25) !important; border-color:#22c55e; }
  .kotak.salah-bg { background: rgba(153,27,27,.25) !important; border-color:#ef4444; }
  .kecil { color: #94a3b8; font-size: 13px; font-style: italic; }

  /* ===== PANDUAN ===== */
  .panduan {
    background: linear-gradient(135deg, rgba(56,189,248,.1), rgba(168,85,247,.05));
    border: 1px solid rgba(56,189,248,.3); border-radius: 12px; padding: 16px; margin: 16px 0;
  }
  .panduan .step { 
    display:inline-block; background:#38bdf8; color:#0f172a; 
    width:24px; height:24px; line-height:24px; text-align:center; 
    border-radius:50%; font-weight:800; font-size:13px; margin-right:8px; 
  }
  .panduan p { margin: 10px 0; font-size: 14.5px; }

  /* ===== PROMOSI & BADGES ===== */
  .promo-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
  .promo-grid a {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 16px 10px; border-radius: 14px; text-decoration: none; color: #fff; 
    font-weight: 700; font-size: 14px; transition: transform .2s, box-shadow .2s; 
    border: 1px solid rgba(255,255,255,.1); letter-spacing: 0.5px;
  }
  .promo-grid a:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,.4); }
  .promo-wa { background: linear-gradient(135deg,#128C7E,#075E54); }
  .promo-ch { background: linear-gradient(135deg,#059669,#047857); }
  .promo-ig { background: linear-gradient(135deg,#f58529,#dd2a7b,#8134af); }
  .promo-tt { background: linear-gradient(135deg,#25F4EE,#000000,#FE2C55); }
  .promo-grid .icon { font-size: 24px; margin-bottom: 8px; }

  .badge { 
    display:inline-block; background:rgba(56,189,248,.1); border:1px solid #38bdf8; 
    border-radius:20px; padding:4px 12px; font-size:12px; color:#38bdf8; 
    margin:3px; font-family: 'Orbitron',sans-serif; letter-spacing: 0.5px;
  }
  .badge-done { background:rgba(34,197,94,.15); border-color:#22c55e; color:#4ade80; }

  .stat-bar { 
    display:flex; justify-content:space-between; align-items:center; 
    background: rgba(15,23,42,.8); border-radius:14px; padding:12px 16px; 
    margin: 15px 0; border:1px solid rgba(56,189,248,.2); font-size:14px; font-weight:700;
  }
  .stat-bar .prog { 
    flex:1; margin: 0 15px; height:10px; background: rgba(255,255,255,.05); 
    border-radius:10px; overflow:hidden; border: 1px solid rgba(255,255,255,0.1);
  }
  .stat-bar .prog div { 
    height:100%; background: linear-gradient(90deg,#0ea5e9,#38bdf8); 
    border-radius:10px; transition: width 0.8s ease-out; 
  }

  .footer-promo { margin-top: 40px; padding-top: 25px; border-top: 1px solid rgba(56,189,248,.2); }
  .opsi-grid { display: flex; gap: 12px; margin-top: 20px; }
  .highlight { color: #38bdf8; font-weight: bold; }
  .teks-pusat { text-align: center; }
</style>

      {q:"Grafik tingkat kepercayaan diri vs pengetahuan di fase awal sering memuncak tajam di titik yang disebut...", o:["Puncak Everest","Mount Stupid (Puncak Kebodohan)","Garis Datar","Jurang Kematian"], a:1, e:"Mount Stupid adalah titik kepercayaan diri tertinggi yang dirasakan seorang pemula."},
      {q:"Penyebab utama orang yang kurang ahli bisa merasa sangat hebat adalah karena mereka kekurangan...", o:["Uang","Gizi otak","Metakognisi (Kemampuan berpikir tentang cara berpikirnya sendiri)","Koneksi internet"], a:2, e:"Tanpa metakognisi, mereka memiliki 'blind spot' terhadap kekurangan mereka."},
      {q:"Ketika seorang pakar sungguhan justru merasa ilmunya kurang dan menganggap dirinya penipu, fenomena ini disebut...", o:["Placebo Effect","Impostor Syndrome (Sindrom Penipu)","Bystander Effect","Mandela Effect"], a:1, e:"Pakar menyadari luasnya lautan ilmu, sehingga merasa ilmu mereka baru sebatas tetesan air."},
      {q:"Dalam kurva pembelajaran Dunning-Kruger, setelah seseorang menyadari kompleksitas ilmu sesungguhnya, kepercayaannya akan jatuh ke dalam...", o:["Surga Pengetahuan","Valley of Despair (Lembah Keputusasaan)","Dataran Tinggi","Gunung Berapi"], a:1, e:"Momen realisasi bahwa bidang tersebut jauh lebih sulit dari perkiraan awal."},
      {q:"Dalam dunia pasar modal/trading, bias ini paling sering menyebabkan...", o:["Keuntungan instan miliaran","Pengambilan risiko investasi yang sembrono (reckless trading) dan kehancuran modal","Sikap sabar","Peningkatan deviden"], a:1, e:"Trader amatir all-in karena merasa sudah 'membaca pergerakan bandar'."},
      {q:"Tingkah laku khas yang sangat dibenci dalam forum intelektual akibat efek ini adalah...", o:["Bertanya dengan sopan","Debat kusir modal sok tahu tanpa referensi literatur valid","Membagikan jurnal internasional","Berdiskusi damai"], a:1, e:"Debat sok tahu seringkali berasal dari orang yang berada di Mount Stupid."},
      {q:"Kata mutiara Sokrates yang sering dianggap sebagai antitesis dari efek Dunning-Kruger adalah...", o:["Saya tahu segalanya","Bumi itu datar","Satu-satunya kebijaksanaan sejati adalah mengetahui bahwa saya tidak tahu apa-apa","Hukum adalah hukum"], a:2, e:"Pengakuan atas batas pengetahuan adalah syarat mutlak memulai pembelajaran ilmiah."},
      {q:"Cara paling efektif untuk 'mengobati' seseorang dari bias Dunning-Kruger adalah...", o:["Mendiamkannya","Memarahinya","Meningkatkan literasi/pendidikan mereka di bidang tersebut hingga menyadari kompleksitasnya","Memberinya jabatan"], a:2, e:"Edukasi akan menghancurkan ilusi kesederhanaan ilmu tersebut."},
      {q:"Di lingkungan perusahaan/kerja kelompok, individu dengan bias ini sering kali...", o:["Sangat proaktif memandu","Gagal menyadari bahwa mereka adalah beban bagi rekan satu timnya","Selalu datang paling pagi","Menerima kritik dengan lapang dada"], a:1, e:"Karena metakognisinya tumpul, mereka selalu merasa kerjanya paling bagus."},
      {q:"Istilah modern untuk orang awam yang merasa lebih paham diagnosis medis daripada dokter profesional sering disebut...", o:["Apoteker andal","Dr. Google (mengandalkan artikel 5 menit di internet)","Perawat spesialis","Tabib magis"], a:1, e:"Akses instan informasi permukaan memicu overconfidence medis."},
      {q:"Apakah efek Dunning-Kruger hanya menyerang orang dengan IQ rendah?", o:["Ya, hanya orang bodoh mutlak","Tidak, fenomena ini universal saat siapa pun mempelajari bidang yang sama sekali baru baginya","Hanya pejabat","Hanya anak sekolah"], a:1, e:"Bahkan ilmuwan jenius di satu bidang bisa kena bias ini jika bicara di bidang lain yang tak dikuasainya."},
      {q:"Filsuf Bertrand Russell mendeskripsikan fenomena ini dengan *quote*: 'Masalah dunia ini adalah orang bodoh terlalu...'", o:["Sering tidur","Pasti/Yakin (Certain), sementara orang berakal penuh keraguan","Banyak bicara politik","Suka uang"], a:1, e:"Kutipan legendaris yang merangkum keseluruhan Dunning-Kruger Effect secara puitis."},
      {q:"Bagaimana sikap seorang intelektual empiris tulen saat dihadapkan pada fakta yang membantah asumsinya?", o:["Marah besar","Meninggalkan forum","Siap merevisi hipotesis pribadinya berdasarkan pembaruan data empiris","Melakukan serangan personal (Ad Hominem)"], a:2, e:"Fleksibilitas berbasis data (Bayesian updating) adalah ciri kedewasaan intelektual."},
      {q:"Apa fungsi dari sistem Peer-Review (Tinjauan Sejawat) dalam jurnal sains berkaitan dengan bias ini?", o:["Mencari siapa yang lebih tua","Menyaring karya dari klaim overconfidence dan metodologi cacat melalui verifikasi pakar buta","Membuat penerbitan mahal","Mempersulit mahasiswa"], a:1, e:"Peer-review adalah mekanisme imun sains terhadap klaim sembrono."}
    ]

  {
    id:"fisika1", judul:"Mekanika Kuantum Dasar", kategori:"Fisika", ikon:"🌌",
    ringkas:"Realitas membengkok di skala sub-atomik; probabilitas menggantikan kepastian.",
    teks:"Mekanika Kuantum adalah fisika dunia mikro (elektron, foton). Di level ini, determinisme hukum Newton hancur lebur. Sebuah partikel bisa eksis di dua keadaan (atau tempat) secara bersamaan (Superposisi), sebelum ia diukur atau diamati oleh detektor eksternal (Runtuhnya Fungsi Gelombang). Partikel juga bisa 'terikat' jarak jauh secara instan lintas galaksi (Keterikatan Kuantum). Fisika kuantum membuktikan alam semesta bekerja berlandaskan probabilitas fundamental, bukan jarum jam yang pasti.",
    contoh:"Dalam Komputasi Kuantum, satuan 'Qubit' bisa bernilai 0 dan 1 secara *bersamaan*, memungkinkan penyelesaian perhitungan algoritma paralel jutaan kali lebih cepat daripada komputer biner biasa.",
    soal:[
      {q:"Mekanika Kuantum difokuskan pada studi perilaku materi di tingkat...", o:["Galaksi raksasa","Kecepatan cahaya makro","Sangat kecil (Skala Atomik / Subatomik)","Cairan kental"], a:2, e:"Berlaku di ukuran nanometer dan partikel elementer."},
      {q:"Prinsip di mana sebuah partikel berada dalam berbagai kemungkinan keadaan secara bersamaan (kombinasi linier) disebut...", o:["Gravitasi Kuantum","Superposisi","Superkonduktivitas","Entropi"], a:1, e:"Superposisi memungkinkan partikel seperti elektron tidak memiliki posisi pasti sebelum diamati."},
      {q:"Fenomena 'Keterikatan Kuantum' (Quantum Entanglement) berarti bahwa dua partikel yang terhubung...", o:["Akan saling tolak-menolak","Bisa berkomunikasi instan mengkoordinasikan *state* mereka meski dipisahkan miliaran tahun cahaya","Hancur menjadi antimateri","Akan meledak"], a:1, e:"Einstein dengan frustrasi menyebut ini 'Spooky action at a distance'."},
      {q:"Satuan informasi dasar dalam sistem komputer Kuantum disebut...", o:["Bit","Megabyte","Qubit (Quantum Bit)","Pixel"], a:2, e:"Qubit beroperasi dalam state 0, 1, atau superposisi keduanya."},
      {q:"Eksperimen klasik Celah Ganda (Double Slit Experiment) mendemonstrasikan bahwa cahaya dan elektron memiliki sifat...", o:["Partikel padat saja","Gelombang statis saja","Dualitas Partikel sekaligus Gelombang (Wave-Particle Duality)","Hanya radiasi radio"], a:2, e:"Partikel menunjukkan pola interferensi gelombang jika tidak dipantau secara spesifik."},
      {q:"Apa yang terjadi pada superposisi elektron menurut Interpretasi Kopenhagen saat partikel tersebut 'DIUKUR' atau 'DIAMATI'?", o:["Ukurannya membesar","Fungsi probabilitas gelombangnya runtuh (Collapse) menjadi keadaan fisik tunggal/pasti","Meledak jadi quark","Berubah warna"], a:1, e:"Efek Pengamat (Observer Effect) memaksa partikel 'memilih' posisi pasti."},
      {q:"Fisikawan Austria yang merumuskan persamaan diferensial untuk menghitung probabilitas fungsi gelombang ini adalah...", o:["Isaac Newton","Erwin Schrödinger","Galileo Galilei","Thomas Edison"], a:1, e:"Persamaan Schrödinger adalah tulang punggung matematis mekanika kuantum."},
      {q:"Eksperimen pikiran Kucing Schrödinger awalnya dibuat untuk menyindir bahwa...", o:["Kucing bisa bernapas tanpa oksigen","Absurd dan konyolnya mengaplikasikan aturan superposisi mikro ke benda makro yang terlihat mata","Kucing membenci radiasi","Fisika itu mudah"], a:1, e:"Menggambarkan konyolnya jika seekor kucing benar-benar berada di state 'hidup-dan-mati' sekaligus."},
      {q:"Interpretasi 'Banyak Dunia' (Many-Worlds Interpretation) dari Hugh Everett menyatakan bahwa...", o:["Bumi memiliki kembaran di tata surya lain","Setiap kali ada keputusan acak kuantum, alam semesta bercabang menciptakan realitas paralel","Alien ada di mana-mana","Dunia ini hanyalah simulasi komputer"], a:1, e:"Semua probabilitas kuantum sungguhan terjadi, namun di *timeline* semesta yang bercabang."},
      {q:"Apakah mekanika kuantum hanya teori abstrak tanpa kegunaan di dunia nyata?", o:["Ya, sepenuhnya teori di atas kertas","Tidak, semikonduktor, transistor HP, Laser, dan pemindai MRI bertumpu penuh pada efek mekanika kuantum","Hanya berguna untuk membikin roket air","Cuma bahan fiksi ilmiah"], a:1, e:"Hampir seluruh teknologi informasi modern mustahil ada tanpa kalkulasi kuantum."},
      {q:"Kutipan legendaris 'Tuhan tidak bermain dadu dengan semesta', yang menunjukkan penolakan mendalam atas probabilitas acak kuantum, diucapkan oleh...", o:["Stephen Hawking","Niels Bohr","Albert Einstein","Richard Feynman"], a:2, e:"Einstein tidak nyaman dengan kenyataan bahwa probabilitas kebetulan (randomness) tertanam dalam struktur dasar realitas."},
      {q:"Sifat fisika yang berpotensi dimanfaatkan oleh Komputer Kuantum masa depan untuk menjebol sistem enkripsi perbankan dunia secara instan adalah algoritma...", o:["Algoritma Pythagoras","Algoritma Shor (Faktorisasi bilangan prima skala masif)","Algoritma YouTube","Algoritma Dijkstra"], a:1, e:"Algoritma Shor mengeksploitasi superposisi untuk memfaktorkan kunci kriptografi eksponensial."},
      {q:"Dalam terminologi 'Kuantum', kata *Quantum* (dari bahasa Latin) sendiri merujuk pada energi fisik yang disalurkan secara...", o:["Gelombang berkelanjutan tanpa putus","Paket-paket diskrit (potongan-potongan energi dengan nilai diskrit spesifik)","Gas padat","Cairan superkritis"], a:1, e:"Radiasi termal / elektron meloncat (leap) secara spesifik (diskrit), bukan halus berkelanjutan."},
      {q:"Fisikawan ikonik Amerika yang terkenal dengan gaya eksentriknya dan menciptakan diagram sederhana (Diagram Feynman) untuk interaksi partikel adalah...", o:["Linus Pauling","J. Robert Oppenheimer","Richard Feynman","Carl Sagan"], a:2, e:"Diagram Feynman menyederhanakan perhitungan matematis kompleks elektrodinamika kuantum."},
      {q:"Efek aneh di mana elektron bisa menembus pembatas solid yang secara energi klasiknya mustahil dilewati (mirip teleportasi tembus tembok) disebut...", o:["Gravitasi terbalik","Quantum Tunneling (Terowongan Kuantum)","Tarik-tambang kosmik","Resonansi Magnetik"], a:1, e:"Efek ini memungkinkan fusi nuklir di Matahari terjadi, dan menjadi prinsip kerja memori Flash (USB drive)."}
    ]
  },
  {
    id:"astronomi1", judul:"Astronomi: Lubang Hitam (Black Hole)", kategori:"Fisika/Astronomi", ikon:"🪐",
    ringkas:"Pemakan segala kosmik yang memiliki kepadatan tak terhingga.",
    teks:"Lubang Hitam terbentuk dari sisa inti bintang super-masif yang kolaps (runtuh ke dalam) saat kehabisan bahan bakar nuklir. Kepadatannya menembus ketakterhinggaan di satu titik (Singularitas). Medan gravitasinya sangat luar biasa ekstrem sehingga merobek tatanan kelengkungan ruang dan waktu. Batas terluar tarikan gravitasi ini disebut 'Event Horizon'. Cahaya—entitas tercepat di semesta—pun tidak bisa kabur jika melewati batas tersebut.",
    contoh:"Jika Anda mendekati Black Hole, gravitasi ekstrem akan membengkokkan dimensi waktu (Time Dilation). Satu menit bagi Anda di sana bisa setara dengan puluhan tahun yang berlalu di Bumi.",
    soal:[
      {q:"Batas pinggir / zona tak bisa kembali (point of no return) pada Black Hole disebut...", o:["Garis Khatulistiwa Kosmik","Inti Singularitas","Wormhole Entry","Cakrawala Peristiwa (Event Horizon)"], a:3, e:"Setelah melewati Event Horizon, kecepatan pelarian (escape velocity) melebihi kecepatan cahaya."},
      {q:"Pusat dari sebuah Black Hole di mana semua massanya terkompresi hingga volume nol dan hukum fisika kita gagal berfungsi disebut...", o:["Singularitas","Bintang Neutron","Pusat Fusi","Quasar"], a:0, e:"Singularity memiliki densitas infinit (tak terhingga)."},
      {q:"Sebuah 'Stellar Black Hole' lahir dari peristiwa kataklismik kosmik berupa...", o:["Tabrakan asteroid biner","Kematian bintang masif dalam ledakan dahsyat (Supernova) yang inti pusatnya runtuh","Bulan yang meledak","Penumpukan awan debu Oort"], a:1, e:"Supernova menghamburkan material luar, sementara intinya terus kolaps di bawah gravitasinya sendiri."},
      {q:"Jika seorang astronot jatuh kaki duluan ke arah Black Hole skala kecil, gradien gravitasi ekstrem akan memelarkan tubuhnya menjadi panjang seperti spageti. Fenomena ini disebut...", o:["Ekspansi Elastis","Spaghettification (Spagetifikasi)","Radiasi Hawking","Efek Redshift"], a:1, e:"Tarikan di ujung kaki jauh lebih besar dari tarikan di kepala, merobek objek pada level atomik."},
      {q:"Apakah Matahari di tata surya kita pada akhirnya akan meledak menjadi Black Hole?", o:["Ya, dijamin dalam 5 miliar tahun","Tidak, massanya kurang besar; ia akan mati menjadi White Dwarf (Katai Putih)","Ya, sebentar lagi","Hanya setengah dari intinya yang jadi Black Hole"], a:1, e:"Bintang harus setidaknya 3-4 kali lebih berat dari matahari kita (Batas Tolman-Oppenheimer-Volkoff) untuk bisa menjadi Black Hole."},
      {q:"Pondasi teori yang berhasil memprediksi secara akurat keberadaan objek pelengkung ruang-waktu seperti Black Hole adalah...", o:["Hukum Gravitasi Universal Newton","Teori Relativitas Umum (Albert Einstein)","Hukum Mekanika Kuantum","Teori Termodinamika"], a:1, e:"Persamaan medan Einstein mendeskripsikan gravitasi sebagai distorsi geometri 'kain' ruang-waktu (Space-Time)."},
      {q:"Black Hole raksasa yang berada persis di pusat Galaksi Bima Sakti (Milky Way) tempat kita bernaung dinamai...", o:["Andromeda Alpha","Sagittarius A* (Sgr A*)","Sirius Supermasif","Pleiades Prime"], a:1, e:"Sgr A* adalah Supermassive Black Hole bermassa jutaan kali Matahari kita."},
      {q:"Karena Black Hole sendiri murni gelap, bagaimana para astronom bisa 'melihat' dan membuktikan keberadaannya di langit malam?", o:["Memakai senter kuantum raksasa","Mengamati radiasi piringan gas super-panas (Accretion Disk) dan efek gravitasinya terhadap bintang sekitar","Menghitung jumlah bintang yang hilang secara manual","Menunggunya bersinar siang hari"], a:1, e:"Material gas yang tersedot ke dalam mengorbit dengan kecepatan fraksi cahaya, memanas karena gesekan, lalu memancarkan sinar-X hebat."},
      {q:"Jaringan teleskop radio global bumi yang bersejarah mencetak foto sejati pertama dari siluet Black Hole (M87) pada tahun 2019 adalah...", o:["Teleskop Luar Angkasa Hubble","Event Horizon Telescope (EHT)","James Webb Space Telescope (JWST)","Observatorium Arecibo"], a:1, e:"EHT menggabungkan data dari berbagai piringan radio di bumi (Interferometri) untuk menciptakan teleskop virtual seukuran bumi."},
      {q:"Efek Dilatasi Waktu Relativistik ekstrem berarti jika Anda diam mengamati Black Hole dari jarak sangat dekat, teman Anda di Bumi akan mengamati Anda...", o:["Menua dengan sangat cepat menjadi debu","Bergerak semakin melambat layaknya *slow-motion*, membeku (freeze), dan memerah","Tiba-tiba meledak","Berubah transparan"], a:1, e:"Gravitasi luar biasa menahan laju waktu dari perspektif pengamat di medan gravitasi lemah (Bumi)."},
      {q:"Konsep jembatan hipotesis matematis yang menghubungkan Black Hole dan White Hole sebagai jalan pintas ruang-waktu menembus dimensi semesta disebut...", o:["Singularitas Telanjang","Lubang Cacing (Wormhole / Jembatan Einstein-Rosen)","Jalan Tol Kuantum","Cincin Dyson"], a:1, e:"Secara teoritis dimungkinkan matematika relativitas, walau butuh materi eksotis (energi negatif) agar tidak kolaps."},
      {q:"Teori bahwa Black Hole sebenarnya memancarkan radiasi termal sangat lambat dan pada suatu hari nanti di ujung usia semesta akan 'menguap' sepenuhnya lenyap dicetuskan oleh...", o:["Albert Einstein","Stephen Hawking (Radiasi Hawking)","Carl Sagan","Neil deGrasse Tyson"], a:1, e:"Hawking menggabungkan mekanika kuantum partikel virtual di bibir event horizon dengan relativitas umum."},
      {q:"Riak pada tenunan ruang-waktu yang tercipta akibat tabrakan brutal dua Black Hole miliaran tahun cahaya dari bumi, dideteksi instrumen LIGO sebagai...", o:["Ledakan suara supersonik di udara","Gelombang Gravitasi (Gravitational Waves)","Hujan meteor raksasa","Semburan radiasi Alfa"], a:1, e:"Gelombang gravitasi secara harfiah meremas dan meregangkan struktur dimensi planet kita sejauh fraksi ukuran proton."},
      {q:"Kelas Black Hole purba misterius dan paling ekstrem, yang berada di jantung miliaran galaksi dan berfungsi bak mesin quasar raksasa disebut kelas...", o:["Micro Black Hole","Supermassive Black Hole","Intermediate Black Hole","Bintang Gelap Primordial"], a:1, e:"Bobotnya jutaan hingga miliaran massa matahari (Solar Mass)."},
      {q:"Dalam diskursus logika, mendebat sains murni tanpa menyertakan referensi observasi matematis maupun empirik akan berujung pada...", o:["Kebenaran mutlak","Lubang hitam kesesatan tak berdasar (Logika Fallacy)","Filsafat tingkat tinggi","Kebahagiaan hakiki"], a:1, e:"Sains mutlak bertumpu pada hukum probabilitas statistik atau verifikasi empiris; sisanya sekadar asumsi."}
    ]
  },
  {
    id:"biologi2", judul:"Evolusi: Mekanisme Seleksi Alam", kategori:"Biologi", ikon:"🦖",
    ringkas:"Adaptasi yang menguntungkan akan diwariskan; yang tidak, akan punah.",
    teks:"Teori Evolusi melalui Seleksi Alam yang digagas Charles Darwin menjelaskan bagaimana keanekaragaman hayati terbentuk tanpa desain dari atas. Konsepnya sederhana: Dalam setiap populasi, terdapat variasi genetik acak. Organisme dengan ciri variasi yang paling cocok (fit) dengan lingkungan sekitarnya memiliki peluang bertahan hidup dan bereproduksi lebih besar. Gen mereka diwariskan, sementara variasi yang tidak menguntungkan tersingkir.",
    contoh:"Ngengat di Inggris yang aslinya berwarna putih berubah mayoritas jadi hitam saat Revolusi Industri, karena ngengat hitam lebih tersamar di batang pohon tertutup jelaga, menghindari predator burung.",
    soal:[
      {q:"Siapa ilmuwan Inggris abad 19 yang paling terkenal dengan publikasi teori Evolusi lewat buku 'On the Origin of Species'?", o:["Gregor Mendel","Louis Pasteur","Charles Darwin","Alexander Fleming"], a:2, e:"Darwin mempublikasikannya tahun 1859 setelah ekspedisinya di kapal HMS Beagle."},
      {q:"Mekanisme utama di balik teori evolusi, yang sering dirangkum dalam frasa 'Survival of the Fittest', disebut...", o:["Seleksi Buatan","Mutasi Terarah","Seleksi Alam (Natural Selection)","Kloning Otomatis"], a:2, e:"Lingkungan menyeleksi varian gen yang paling menguntungkan untuk bertahan."},
      {q:"Bahan baku (raw material) utama yang memungkinkan seleksi alam bekerja membedakan antar individu dalam satu populasi adalah...", o:["Suhu udara","Mutasi genetik acak (Variasi)","Bentuk awan","Keinginan hewan itu sendiri"], a:1, e:"Tanpa variasi genetik akibat mutasi/rekombinasi, evolusi tidak bisa terjadi."},
      {q:"Arti kata 'Fit' dalam frasa *Survival of the Fittest* biologi evolusioner sebenarnya bermakna...", o:["Organisme yang berotot paling besar dan kuat","Organisme dengan kemampuan adaptasi lingkungan & keberhasilan reproduksi terbaik","Spesies yang paling ganas","Hewan yang larinya paling cepat"], a:1, e:"'Fit' merujuk pada *Reproductive Fitness*, kemampuan meneruskan gen."},
      {q:"Proses di mana manusia secara sengaja mengawinkan anjing jenis tertentu untuk mendapatkan keturunan ras yang diinginkan disebut...", o:["Seleksi Alam","Seleksi Seksual","Seleksi Buatan (Artificial Selection)","Mutasi Buatan"], a:2, e:"Manusia yang menjadi 'agen penyeleksi', bukan alam bebas."},
      {q:"Penemuan di bidang genetika oleh bapak genetika modern yang nantinya membenarkan dan memperkuat hipotesis evolusi Darwin dilakukan oleh...", o:["Albert Einstein","Gregor Mendel (Hukum Pewarisan Sifat)","Robert Hooke","Carl Linnaeus"], a:1, e:"Mendel menemukan dasar pewarisan alel gen (kacang ercis), mengisi kekosongan teori pewarisan Darwin."},
      {q:"Organ pada manusia seperti usus buntu (appendix) atau tulang ekor yang fungsinya telah menyusut drastis sepanjang sejarah evolusi disebut organ...", o:["Vestigial","Regeneratif","Fosil hidup","Super-organ"], a:0, e:"Sisa-sisa anatomi dari leluhur evolusioner yang sudah tidak esensial lagi."},
      {q:"Dua spesies berbeda yang berevolusi secara terpisah namun mengembangkan bentuk sayap yang mirip (misal: kelelawar dan burung) merupakan fenomena...", o:["Evolusi Divergen","Evolusi Konvergen","Kepunahan Massal","Radiasi Adaptif"], a:1, e:"Menghadapi masalah lingkungan yang sama (butuh terbang) memicu solusi desain alam yang analog/mirip."},
      {q:"Kepulauan terisolasi yang menginspirasi Darwin karena burung Finch-nya memiliki paruh yang berbeda-beda sesuai jenis makanan di pulau tersebut adalah kepulauan...", o:["Hawaii","Galapagos","Maladewa","Bermuda"], a:1, e:"Isolasi geografis di Galapagos mempercepat spesiasi secara lokal."},
      {q:"Miskonsepsi awam yang paling umum dan keliru mengenai evolusi manusia adalah pernyataan...", o:["Manusia berevolusi selama jutaan tahun","'Manusia berasal/berevolusi langsung dari Kera modern (Simpanse)'","Manusia punya DNA sama dengan hewan","Otak manusia membesar karena berevolusi"], a:1, e:"Kenyataannya, manusia BUKAN keturunan kera modern; kita dan kera modern memiliki (berbagi) leluhur moyang yang sama (Common Ancestor) yang kini telah punah."},
      {q:"Fenomena di mana burung Merak jantan berevolusi memiliki ekor yang berat, terang, dan tidak efisien untuk terbang semata-mata demi menarik perhatian betina disebut...", o:["Seleksi Alam ekstrim","Seleksi Seksual (Sexual Selection)","Mutasi mematikan","Penipuan biologi"], a:1, e:"Sifat dievolusikan demi keberhasilan kawin, meski merugikan ketahanan bertahan hidup individu."},
      {q:"Bukti empiris terkuat adanya garis waktu evolusi jutaan tahun di masa lalu yang terkubur dalam strata geologi bumi adalah...", o:["Legenda turun-temurun","Catatan fosil kuno (Fossil Record)","Bentuk batu sungai","Gambar di gua"], a:1, e:"Fosil organisme transisi merekam perubahan morfologi spesies lintas zaman geologi."},
      {q:"Proses di mana satu populasi purba terpisah menjadi dua oleh gunung atau laut, sehingga keduanya tidak bisa kawin dan akhirnya berevolusi jadi spesies terpisah disebut...", o:["Spesiasi Alopatrik","Spesiasi Simpatrik","Punah otomatis","Kloning massal"], a:0, e:"Alopatrik = spesiasi karena hambatan geografis absolut."},
      {q:"Revolusi modern yang menggabungkan prinsip genetika DNA populasi dengan teori seleksi alam Darwinian dikenal di sains akademis sebagai...", o:["Revolusi Biokimia","Modern Synthesis (Sintesis Evolusioner Modern)","Neo-Klasik","Teori Penciptaan"], a:1, e:"Kerangka kerja biologi abad 20 yang memadukan Darwin, Mendel, dan Watson-Crick."},
      {q:"Bagaimana seharusnya sikap saintifik anggota grup intelektual merespons klaim anti-evolusi tanpa dasar genetika?", o:["Menerimanya sebagai teori tandingan setara","Menuntut pembuktian jurnal berbasis *peer-review* genetik & jejak molekuler DNA","Mengejek secara personal (Ad Hominem)","Menyerah berargumen"], a:1, e:"Sains biologis harus dijawab dengan argumen empirik molekuler mikrobiologi, bukan asumsi hampa."}
    ]

  {
    id:"logika1", judul:"Filsafat & Logika: Kesesatan Berpikir (Fallacy)", kategori:"Logika Dasar", ikon:"⚖️",
    ringkas:"Membedah anatomi argumen cacat dan tipuan retorika dalam perdebatan.",
    teks:"Logika adalah cabang filsafat yang menelaah validitas inferensi atau penarikan kesimpulan. Dalam debat, sering muncul 'Logical Fallacy' (Kesesatan Berpikir): kesalahan struktur penarikan kesimpulan yang membuat suatu argumen menjadi tidak valid, meskipun terdengar meyakinkan bagi orang awam. Mengetahui ragam kesesatan ini adalah perlindungan utama dari propaganda politisi, *hoax* sosial media, dan pembodohan masal.",
    contoh:"Seseorang mengatakan, 'Teori gravitasi itu salah karena ilmuwan X ketahuan selingkuh.' (Ini cacat Ad Hominem: menyerang karakter pribadi pembicara, yang sama sekali tak ada hubungannya dengan kebenaran konsep fisika argumennya).",
    soal:[
      {q:"Menyerang kepribadian, ras, atau karakter lawan debat alih-alih membantah isi argumennya disebut kesesatan...", o:["Strawman Fallacy","Ad Hominem","Slippery Slope","Bandwagon Fallacy"], a:1, e:"Ad Hominem (To the Man) mengalihkan argumen dari logika ke serangan personal."},
      {q:"Membangun ulang argumen lawan menjadi versi yang distorsi, lebih lemah, atau dilebih-lebihkan lalu menyerang versi palsu tersebut, disebut cacat logika...", o:["Ad Populum","Strawman (Orang-orangan Sawah)","Red Herring","False Dilemma"], a:1, e:"Seolah-olah memukul KO lawan, padahal yang dipukul hanya tiruan argumen lawan (Strawman)."},
      {q:"'RUU ini pasti bagus karena jutaan warga mendukungnya!' Ini merupakan cacat pikiran dengan berlindung pada popularitas yang disebut...", o:["Bandwagon Effect / Ad Populum","Appeal to Emotion","Ad Hominem","Circular Reasoning"], a:0, e:"Kebenaran absolut tidak bergantung pada suara voting mayoritas orang awam (Kebenaran bukan demokrasi)."},
      {q:"Kesesatan logika 'False Dilemma' (Dikotomi Palsu) terjadi apabila debater...", o:["Berbohong terang-terangan","Memberikan hanya DUA pilihan ekstrem seolah itu satu-satunya opsi (misal: 'Kau dukung kami atau kau musuh kami!')","Banyak diam","Minta maaf"], a:1, e:"Menyembunyikan fakta bahwa ada nuansa atau pilihan ketiga, keempat, dst."},
      {q:"'Kita selalu melakukan hal ini selama ratusan tahun, berarti tradisi ini adalah tindakan paling benar.' Ini adalah contoh kesesatan...", o:["Appeal to Tradition (Ad Antiquitatem)","Appeal to Authority","Strawman","Confirmation Bias"], a:0, e:"Sebuah sistem yang dilakukan lama belum tentu yang paling benar, relevan, atau beretika secara modern."},
      {q:"Mengubah topik obrolan secara mendadak dengan fakta yang tidak relevan di tengah perdebatan untuk mengecoh pihak lawan disebut taktik...", o:["Black or White","Red Herring (Ikan Haring Merah)","Texas Sharpshooter","Gambler's Fallacy"], a:1, e:"Melemparkan 'ikan busuk' agar anjing pelacak tersesat dari jejak argumen utama."},
      {q:"'Jika kita izinkan anak main HP 1 jam sekarang, besok dia mau 3 jam, bulan depan dia putus sekolah dan jadi perampok!' Ini adalah jenis kesesatan lompatan berlebihan yang disebut...", o:["Ad Hominem","Tu Quoque","Slippery Slope (Lereng Licin)","Genetic Fallacy"], a:2, e:"Asumsi bahwa langkah kecil A akan pasti memicu reaksi berantai domino ekstrem Z tanpa bukti perantara."},
      {q:"Beban pembuktian (Burden of Proof) dalam hukum logika ilmiah secara default selalu berada di pundak...", o:["Orang yang mendengar klaim","Pihak yang pertama KALI mengajukan KLAIM (terutama klaim luar biasa)","Wasit debat","Pihak yang menolak klaim"], a:1, e:"'Extraordinary claims require extraordinary evidence.' (Klaim luar biasa butuh bukti luar biasa). Yang membuat klaim wajib membuktikan."},
      {q:"'Kamu bilang merokok itu haram dan merusak paru, padahal kamu sendiri juga merokok tiap hari! Jadi argumen paru rusakmu salah!' Balasan ini tergolong cacat logika...", o:["Post Hoc","Tu Quoque (Kau juga) / Appeal to Hypocrisy","Red Herring","Halo Effect"], a:1, e:"Kemunafikan pembicara TIDAK membatalkan fakta ilmiah dari isi ucapannya (merokok tetap merusak paru)."},
      {q:"Kesesatan menyimpulkan hubungan kausalitas (Sebab-Akibat) semata-mata karena dua kejadian terjadi secara berurutan waktu (misal: 'Ayam berkokok, lalu matahari terbit, jadi ayam penyebab terbit') dinamakan...", o:["Post Hoc Ergo Propter Hoc","Ad Hominem","Strawman","False Equivalence"], a:0, e:"Korelasi urutan waktu atau kejadian bersamaan TIDAK SAMA DENGAN Kausalitas (Korelasi bukan Kausalitas)."},
      {q:"Mengasumsikan kesimpulan argumen di dalam premis itu sendiri (misal: 'Buku ini pasti benar karena buku ini mengatakan dirinya berisi kebenaran mutlak') dinamakan kelumpuhan rasio...", o:["Slippery Slope","Circular Reasoning (Penalaran Melingkar) / Begging the Question","Ad Populum","Texas Sharpshooter"], a:1, e:"Struktur berputar pada dirinya sendiri tanpa bukti dukungan eksternal sedikit pun."},
      {q:"Mencocok-cocokkan data agar sesuai hipotesis sendiri setelah semuanya terjadi, lalu mengabaikan data berlawanan (seperti menembak dinding acak lalu melukis target di lubang peluru yang rapat), dikenal dengan bias...", o:["Confirmation Fallacy","Texas Sharpshooter Fallacy","Bystander Effect","Bandwagon"], a:1, e:"Mencari pola dan kesamaan pada hal-hal acak demi membenarkan dugaan apriori."},
      {q:"Klaim kebenaran berbasis pada ketidaktahuan: 'Karena sains belum bisa menjelaskan fenomena lampu berkedip itu 100%, maka itu PASTI ulah hantu alien.' Kesesatan ini dinamakan...", o:["Appeal to Ignorance (Argumentum ad Ignorantiam)","Appeal to Fear","False Cause","Ad Populum"], a:0, e:"Kekosongan data/Sains yang belum tahu (Ignorance) tidak bisa dijadikan bukti pembenaran teori gaib Anda."},
      {q:"Sebuah debat dianggap sebagai dialektika yang elegan oleh grup intelektual apabila kedua belah pihak menerapkan...", o:["Prinsip Amal (Principle of Charity) dengan menginterpretasikan argumen lawan di titik terkuatnya sebelum merespon","Gaya merendahkan secara konstan","Suara berteriak lebih keras","Blokir akun lawan"], a:0, e:"Lawan dari *Strawman*; membantah versi terbaik/terkuat dari argumen pihak lawan menunjukkan intelektualitas kelas atas."},
      {q:"Kenapa penting mempelajari peta *Logical Fallacies* dalam dunia pasca-kebenaran modern?", o:["Biar terlihat sombong","Untuk menjadi kebal dari manipulasi kognitif politikus, *scammer*, pseudo-saintis, dan provokator kultus di era informasi banal","Agar bisa membully","Tidak ada gunanya sama sekali"], a:1, e:"Berpikir kritis murni adalah pertahanan sipil (self-defense) yang paling utama bagi akal manusia."}
    ]
  },
  {
    id:"kripto1", judul:"Matematika Kriptografi", kategori:"Tech/Matematika", ikon:"🔐",
    ringkas:"Seni menyandikan rahasia dari Julius Caesar hingga Keamanan Internet Global.",
    teks:"Kriptografi adalah ilmu matematika yang berfokus pada pengamanan informasi/komunikasi. Sejarah mencatat 'Caesar Cipher', sandi substitusi geser abjad sederhana warisan Kekaisaran Romawi Kuno. Kini di era digital, sistem keamanan pesan menggunakan sistem kriptografi Kunci Asimetris (Public-Key Cryptography) super canggih seperti Algoritma RSA. Keamanan ini bukan dilindungi kata sandi saja, tapi oleh faktorisasi bilangan prima masif beratus digit yang secara matematis butuh jutaan tahun untuk diretas oleh komputer biner konvensional saat ini.",
    contoh:"Ketika Anda membuka website perbankan berlogo gembok (HTTPS/SSL), komputer Anda dan server bertukar 'Kunci Publik' agar *hacker* di tengah jaringan Wi-Fi cafe hanya bisa melihat rentetan angka/huruf acak (Ciphertext).",
    soal:[
      {q:"Tujuan utama algoritma ilmu kriptografi adalah...", o:["Membuat virus","Mengonversi informasi mudah baca (Plaintext) menjadi data acak rahasia (Ciphertext) agar aman","Menghapus data orang lain","Meningkatkan resolusi video"], a:1, e:"Menjaga aspek kerahasiaan komunikasi (Confidentiality)."},
      {q:"Sandi kuno substitusi abjad peninggalan kaisar Romawi yang digeser sejumlah huruf (misal A menjadi D, B menjadi E) disebut...", o:["Enigma Code","Caesar Cipher (Sandi Caesar)","RSA Algorithm","Vigenère Cipher"], a:1, e:"Teknik dasar penggeseran karakter sejauh nilai tertentu (Key)."},
      {q:"Proses mengembalikan teks yang disandikan (Ciphertext) agar bisa dibaca kembali manusia (Plaintext) menggunakan kunci yang tepat disebut...", o:["Enkripsi (Encryption)","Dekripsi (Decryption)","Hacking","Formatting"], a:1, e:"Dekripsi adalah kunci membalikkan pengacakan matematika yang direkayasa."},
      {q:"Mesin enkripsi mekanik Jerman yang sangat rumit pada Perang Dunia II yang akhirnya diretas oleh bapak komputasi modern Alan Turing bernama...", o:["Babbage Engine","Mesin Enigma","Deep Blue","Commodore 64"], a:1, e:"Alan Turing membuat komputer purba 'Bombe' untuk membongkar sandi Nazi yang dikira tak tertembus."},
      {q:"Dalam era modern digital, enkripsi yang menggunakan SATU kunci rahasia yang sama persis untuk mengunci (Enkripsi) dan membuka (Dekripsi) disebut kriptografi...", o:["Kunci Publik","Kunci Simetris (Symmetric-Key)","Tanpa Kunci","Fisika Kuantum"], a:1, e:"Metode paling cepat namun rentan jika kuncinya dicuri kurir (Key Distribution Problem)."},
      {q:"Terobosan algoritma kriptografi internet asimetris modern yang menggunakan 'sepasang' kunci berbeda—(Kunci Publik untuk mengunci, Kunci Privat rahasia untuk membuka)—disebut...", o:["Algoritma AES","Public-Key Cryptography (seperti RSA)","Caesar Box","Hashing"], a:1, e:"Revolusi ini memungkinkan dua komputer asing bertukar rahasia tanpa harus mengirim password via pos."},
      {q:"Kekuatan keamanan *brute-force* algoritma RSA (Rivest-Shamir-Adleman) bergantung pada problem 'Mustahil/Sangat Sulit' di ranah ilmu matematika murni, yaitu...", o:["Perhitungan Kalkulus dasar","Mencari dua faktor bilangan prima raksasa (Prime Factorization) dari sebuah bilangan ribuan digit","Menyelesaikan Trigonometri","Menghitung limit Aljabar"], a:1, e:"Sangat mudah mengalikan dua prima, namun mustahil bagi komputer saat ini melacak mundur akar prima dari hasil kalinya."},
      {q:"Metode matematis searah (*one-way function*) yang mengubah pasword Anda menjadi *fingerprint* unik teks acak pendek tapi tak bisa dibalikkan lagi menjadi aslinya, digunakan di basis data website disebut sistem...", o:["ZIP Extract","Cryptographic Hash (seperti SHA-256)","Caesar Rotate","Steganography"], a:1, e:"Server tidak pernah menyimpan password asli Anda, melainkan hanya menyimpan Hash-nya."},
      {q:"Menyembunyikan pesan rahasia di dalam *pixel* gambar biasa sehingga secara kasat mata gambar terlihat normal disebut dengan cabang ilmu...", o:["Kriptoanalisis","Steganografi","Fisika Optik","Fotografi"], a:1, e:"Berbeda dengan Kriptografi (mengacak isi), Steganografi murni 'menyembunyikan keberadaan' isi dokumen tersebut."},
      {q:"Protokol keamanan gembok internet modern berlogo hijau HTTP yang melindungi data kartu kredit dari penyadapan saat belanja *online* dikenal dengan singkatan...", o:["VPN (Virtual Private Network)","SSL/TLS (HTTPS)","LAN (Local Area Network)","FTP (File Transfer)"], a:1, e:"Hypertext Transfer Protocol Secure menggunakan negosiasi asimetris RSA/ECC."},
      {q:"Ancaman komputasi teoritis masa depan terbesar yang diramalkan akan menghancurkan algoritma RSA dalam hitungan jam karena kemampuannya memfaktorkan prima ekstrem disebut...", o:["Ransomware","Komputer Kuantum (Quantum Computer)","Virus Trojan","Komputer Super Cray"], a:1, e:"Berbekal algoritma Shor, qubit kuantum diprediksi menembus tembok RSA masa kini."},
      {q:"Teknologi jurnal besar desentralisasi terdistribusi publik (*Distributed Ledger*) yang menjamin transaksi *Bitcoin* kebal dari pemalsuan karena dienkripsi fungsi Hash secara berantai adalah teknologi...", o:["Database MySQL biasa","Blockchain","Sistem Cloud Google","Spreadsheet Excel"], a:1, e:"Kumpulan blok data diikat secara kriptografis sehingga tak bisa diganti ke belakang."},
      {q:"Ilmuwan Inggris yang memecahkan sandi Enigma dan meletakkan dasar teori algoritma komputer (Turing Machine) sekaligus dianggap pahlawan perang digital adalah...", o:["Albert Einstein","Alan Turing","Nikola Tesla","Thomas Edison"], a:1, e:"Turing memendekkan durasi PD II secara signifikan berkat kemampuan analitik dan matematikanya."},
      {q:"Teknik *hacker* mencoba menebak *password/key* enkripsi dengan memprogram *script* yang mengacak semua miliaran kemungkinan kombinasi huruf/angka sampai ketemu disebut serangan...", o:["Phishing (Tipuan web palsu)","Brute Force Attack (Kekuatan Penuh/Kasar)","Social Engineering (Rekayasa Sosial)","Malware Injection"], a:1, e:"Algoritma bit modern dibuat panjang (contoh: 256-bit) murni agar serangan ini butuh waktu triliunan tahun."},
      {q:"Grup elit seperti Omni Sync selalu menganjurkan agar anggota komunitas menjaga privasi *cyber* mereka via aplikasi obrolan karena sistem pesannya sudah terlindungi protokol kriptografi...", o:["Open Server Data","End-to-End Encryption (E2EE)","Plain Text Signal","Enkripsi Parsial"], a:1, e:"E2EE berarti hanya pengirim dan pembaca akhir yang memegang kunci privat. Server aplikasi WhatsApp/Signal itu sendiri pun buta akan isi chatnya."}
    ]
  },
  {
    id:"psikologi2", judul:"Psikologi: Bias Konfirmasi", kategori:"Psikologi Kognitif", ikon:"🧠",
    ringkas:"Manusia hanya mau mendengar apa yang sudah sejalan dengan isi kepalanya.",
    teks:"Bias Konfirmasi (Confirmation Bias) adalah kelemahan naluri kognitif fatal manusia modern. Fenomena ini merujuk pada kecenderungan insting untuk hanya mencari, menafsirkan, mengingat, dan mempercayai informasi yang mendukung/sejalan dengan keyakinan pribadi sebelumnya. Secara simultan, otak akan 'membutakan diri' atau mencari ribuan alasan menolak data keras empiris yang menentang asumsianya. Di era digital, algoritma media sosial mengeksploitasi bias ini hingga menciptakan ruang gema (*Echo Chamber*).",
    contoh:"Orang yang yakin Bumi itu datar akan mengabaikan ratusan *paper* fisika satelit, tapi girang kegirangan saat melihat satu video YouTube amatir bersuara misterius yang tampak mendukung keyakinannya tersebut.",
    soal:[
      {q:"Bias Konfirmasi (Confirmation Bias) secara akademis didefinisikan sebagai kecenderungan psikologis seseorang untuk secara tidak sadar...", o:["Mencari data yang netral","Hanya menyeleksi dan percaya pada informasi yang mendukung opini/kepercayaan awalnya","Berpikiran terbuka luas","Membaca jurnal ilmiah"], a:1, e:"Ini adalah cara instan otak menghemat energi, menghindari konflik mental."},
      {q:"Akibat utama bias konfirmasi di kehidupan sosial adalah seseorang akan menjadi sangat...", o:["Toleran dan objektif","Dogmatis, tertutup, dan fanatik terhadap kebenaran asumsianya sendiri","Pintar","Cepat kaya"], a:1, e:"Dogma tumbuh subur ketika bukti bantahan tidak pernah diizinkan masuk ke pikiran."},
      {q:"Gejala psikologis ketidaknyamanan batin yang luar biasa saat seseorang dihadapkan pada fakta empiris yang membongkar keyakinan fanatiknya disebut distorsi...", o:["Bystander Effect","Cognitive Dissonance (Disonansi Kognitif)","Stockholm Syndrome","Pluralistic Ignorance"], a:1, e:"Konflik batin akibat benturan keyakinan lama vs fakta baru."},
      {q:"Bias ini berevolusi pada nenek moyang mamalia kita *Sapiens* karena otak dirancang primitif untuk lebih memprioritaskan fungsi...", o:["Pencarian fakta saintifik absolut","Ketahanan ego (Ego defense), identitas suku/kelompok, dan energi mental yang murah","Rumus algoritma matematika","Mengapresiasi seni estetika"], a:1, e:"Sangat mahal bagi kalori otak secara evolusioner untuk selalu meragukan segalanya."},
      {q:"Dalam eksperimen psikologi pembuktian kartu kognitif sederhana (Wason Selection Task), mayoritas orang terjebak secara logika murni karena mereka cenderung selalu memilih kartu yang...", o:["Bisa menyalahkan hipotesisnya","Mencoba MEMBENARKAN aturan hipotesis aslinya (berusaha mengonfirmasi)","Warna merah","Warna genap"], a:1, e:"Orang jarang mengambil langkah 'menguji untuk mencari tahu apakah aturan saya ini salah'."},
      {q:"Kondisi mengerikan di era digital di mana pengguna dipenjara dalam 'gelembung' komunitas *online*—hanya berisi opini sejenis—tanpa pernah terekspos pihak oposan disebut realitas...", o:["Echo Chamber (Ruang Gema) / Filter Bubble","Marketplace Sosmed","Public Square","Network Effect"], a:0, e:"Kumpulan orang berpikiran sama saling memvalidasi dogma buta karena algoritma memfilter sisanya."},
      {q:"Algoritma jejaring sosial (seperti TikTok, YouTube, IG, Facebook) dengan sengaja mengeksploitasi dan memperparah fenomena *Confirmation Bias* demi mendongkrak satu tujuan perusahaan, yaitu metrik...", o:["Edukasi Publik (Literasi global)","Engagement (waktu tonton panjang & retensi *scroll* pemicu hormon dopamin)","Kesehatan mental (*Mental health*)","Perdamaian politik antar benua"], a:1, e:"Memperlihatkan fakta yang dibenci pengguna akan membuat pengguna muak dan menutup aplikasi (berdampak buruk ke iklan)."},
      {q:"Ketika dua pihak berdebat politik buta secara daring lalu keduanya disodorkan sebuah *paper* statistik yang SAMA PERSIS, efek bias konfirmasi akan membuat keduanya...", o:["Sadar bahwa mereka berdua keliru","Memakai bagian paper yang menguntungkannya untuk makin yakin dirinya benar (Polarisasi makin tajam)","Mendadak saling berpelukan dan menangis","Keluar grup sosmed tanpa sepatah kata"], a:1, e:"Fenomena ini disebut Backfire Effect: data netral ditekuk untuk memperkuat benteng masing-masing pihak."},
      {q:"Sikap fundamental dalam metodologi penelitian Sains murni yang dirancang secara spesifik untuk menghancurkan bias konfirmasi sang ilmuwan (Konsep Falsifikasi Karl Popper) berwujud prinsip...", o:["'Sebuah teori ilmiah sejati haruslah bisa diuji untuk dibuktikan SALAH/Falsify'","'Ilmuwan harus mencari bukti bahwa teorinya pasti absolut benar'","'Teori tidak boleh dites secara kasar'","'Cukup gunakan voting suara'"], a:0, e:"Sains tidak membuktikan 'kebenaran absolut', sains membongkar/mengeliminasi kebohongan dan probabilitas palsu."},
      {q:"Bias konfirmasi ini menyebabkan maraknya fenomena di masyarakat awam ketika menangani isu kesehatan. Fenomena tersebut paling jelas terjadi pada kasus dogma...", o:["Gerakan diet gula ketat","Gerakan Anti-Vaksin atau peracikan *pseudo-medicine* (Obat gaib/alternatif) berbahaya tanpa uji klinis","Tindakan ke UGD saat patah tulang","Operasi katarak modern"], a:1, e:"Seorang *anti-vaxxer* akan mengabaikan sejuta bukti anak sehat yang disuntik, dan menyorot mati-matian satu anak yang malang kebetulan demam pasca divaksin."},

/**
 * Mengambil data progres kuis pengguna.
 * @returns {Object} Data progres pengguna.
 */
function getSkor(){ 
  try { 
    return JSON.parse(localStorage.getItem("omnisync_skor")||"{}"); 
  } catch(e){ 
    return {}; 
  } 
}

/**
 * Menyimpan progres materi yang telah diselesaikan.
 * @param {string} id ID materi yang telah dikerjakan.
 */
function setSkor(id){ 
  const s = getSkor(); 
  s[id] = true; 
  try{ 
    localStorage.setItem("omnisync_skor", JSON.stringify(s)); 
  }catch(e){} 
}

/**
 * Mengecek apakah materi sudah diselesaikan dengan akurasi memadai.
 * @param {string} id ID materi.
 * @returns {boolean}
 */
function cekSelesai(id){ 
  return getSkor()[id] === true; 
}

/**
 * Fungsi untuk mengacak urutan elemen dalam sebuah array (Fisher-Yates Shuffle).
 * @param {any[]} arr Array yang akan diacak.
 * @returns {any[]} Array dengan elemen yang telah diacak.
 */
function acakArray(arr) {
  let array = [...arr];
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

/**
 * Fungsi *Router* untuk navigasi antar-halaman secara responsif.
 * @param {string} view Nama tampilan yang akan dimuat.
 * @param {number|null} param Parameter atau indeks materi (jika relevan).
 */
function go(view, param = null) {
  state.view = view;
  if(param !== null) state.param = param;
  renderApp();
}

function renderApp() {
  if(state.view === 'home') renderHome();
  else if(state.view === 'tentang') renderTentang();
  else if(state.view === 'materi') renderMateri();
  else if(state.view === 'detail') renderDetail();
  else if(state.view === 'quiz_config') renderQuizConfig();
  else if(state.view === 'kuis') renderKuis();
  else if(state.view === 'hasil') renderHasil();
  else if(state.view === 'selesai') renderSelesai();
}

/**
 * Memulai logika kuis, mengacak set soal berdasarkan jumlah yang dipilih.
 * @param {number} amount Jumlah soal yang akan ditampilkan.
 */
function startQuiz(amount) {
  state.soalSet = acakArray(MATERI[state.param].soal).slice(0, amount);
  state.qIdx = 0;
  state.skor = 0;
  go('kuis');
}

function renderKuis() {
  const s = state.soalSet[state.qIdx];
  const qNum = state.qIdx + 1;
  const total = state.soalSet.length;
  const progressPct = ((qNum - 1) / total) * 100;
  
  let opsiHtml = "";
  s.o.forEach((opsiTxt, i) => {
    opsiHtml += `<button class="btn jawaban" onclick="cekJawaban(${i})"><span style="font-weight:800; color:#38bdf8; margin-right:8px;">${String.fromCharCode(65+i)}.</span> ${opsiTxt}</button>`;
  });

  const html = `
    <div class="animasi-halaman" id="kuis-container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2 style="margin:0; font-size:18px;">ANALISIS KOGNITIF : ${qNum} / ${total}</h2>
        <span class="badge" style="margin:0; font-size:10px; border-color:#cbd5e1; color:#cbd5e1;">MODUL: ${MATERI[state.param].kategori.toUpperCase()}</span>
      </div>
      
      <div style="width:100%; height:6px; background:rgba(255,255,255,0.05); border-radius:4px; margin-bottom:20px; overflow:hidden;">
        <div style="width:${progressPct}%; height:100%; background:linear-gradient(90deg, #0284c7, #38bdf8); transition:width 0.4s ease-out;"></div>
      </div>
      
      <div class="kotak" style="font-size: 16px; font-weight:700; line-height:1.6; border-color:#0ea5e9;">${s.q}</div>
      
      <div id="opsi-container" style="display:grid; gap:8px;">${opsiHtml}</div>
      
      <div id="hasil-jawaban" style="margin-top:20px;"></div>
    </div>`;
  appEl.innerHTML = html;
  window.scrollTo({top:0, behavior:'smooth'});
}

/**
 * Pengecekan jawaban yang dikirimkan user untuk dibandingkan secara logika.
 * @param {number} userIndex Nomor index opsi yang diklik oleh user (0-3).
 */
window.cekJawaban = function(userIndex) {
  const s = state.soalSet[state.qIdx];
  const isBenar = (userIndex === s.a);
  const container = document.getElementById('opsi-container');
  const btns = container.querySelectorAll('.btn.jawaban');
  
  // Kunci tombol pasca-pemilihan
  btns.forEach((b, i) => {
    b.disabled = true;
    if(i === s.a) b.classList.add('benar'); // Opsi sebenarnya dighighlight Hijau
    else if(i === userIndex && !isBenar) b.classList.add('salah'); // Jawaban meleset dihighlight Merah
  });

  if(isBenar) state.skor++;

  const isLast = (state.qIdx === state.soalSet.length - 1);
  const btnNext = isLast 
    ? `<button class="btn biru" style="padding:16px; font-size:16px; text-transform:uppercase; letter-spacing:1px; box-shadow:0 0 20px rgba(56, 189, 248, 0.4);" onclick="go('hasil')">📊 Komputasi Nilai Akhir</button>`
    : `<button class="btn ok" style="padding:16px;" onclick="nextQuestion()">➡ Muat Segmen Data Berikutnya</button>`;

  const hasilDiv = document.getElementById('hasil-jawaban');
  hasilDiv.innerHTML = `
    <div class="kotak ${isBenar ? 'benar-bg' : 'salah-bg'} animasi-halaman" style="margin-bottom:20px;">
      <h3 style="color: ${isBenar ? '#4ade80' : '#f87171'}; margin-bottom:10px; font-size:18px;">
        ${isBenar ? '✅ KORELASI LOGIS TERKONFIRMASI' : '❌ ANOMALI DATA: LOGIKA MELESET'}
      </h3>
      <p style="font-size:14.5px; line-height:1.6;"><b>Fakta Evaluasi AI:</b><br/>${s.e}</p>
    </div>
    ${btnNext}
  `;
  // Gulung ke bawah secara halus
  setTimeout(() => hasilDiv.scrollIntoView({behavior:'smooth', block:'end'}), 150);
}

window.nextQuestion = function() {
  state.qIdx++;
  renderKuis();
}

function renderHasil() {
  const total = state.soalSet.length;
  const persentase = Math.round((state.skor / total) * 100);
  
  // Berikan status validasi lulus jika >= 60%

  let pesan, emot, warna, karakterAI;
  if(persentase === 100) {
    pesan = "Akurasi Rasio Maksimal. Otak Anda sejalan sempurna dengan data empiris.";

  const html = `

        <div style="background:rgba(255,255,255,0.05); border-radius:10px; margin:20px auto 10px; padding:10px; max-width:80%; border:1px solid rgba(255,255,255,0.1);">

  appEl.innerHTML = html;
